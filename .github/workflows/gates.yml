# Repo gates — the same three checks the local pre-commit shim runs, enforced
# on every push and PR so a clone without the hook installed cannot silently
# land a count drift, a taxonomy mismatch, or a release-breaking metadata file.
# count_reconcile.py runs in full (not --staged) mode here: in CI every stated
# count must agree with the derived truth, not only the ones a commit touched.
name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install check dependencies
        run: pip install pyyaml cffconvert
      - name: Count reconciliation (all gated surfaces)
        run: python3 scripts/count_reconcile.py
      - name: Source taxonomy reconciliation
        run: python3 scripts/derive_source_taxonomy.py --check
      - name: Zenodo/CFF metadata validation
        run: python3 scripts/validate_metadata.py
      - name: Secret scan
        run: bash scripts/secret-scan.sh
