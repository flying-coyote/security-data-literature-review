<text x="476" y="656" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="26" font-weight="400" fill="#5b6878" text-anchor="start">355 excluded; 0 of 40 already in corpus</text>
<line x1="512" y1="678" x2="512" y2="878" stroke="#5b6878" stroke-width="4" marker-end="url(#ah)"/>
<rect x="572" y="706" width="460" height="130" rx="12" fill="#ffffff" stroke="#87aacf" stroke-width="2" stroke-dasharray="8 6"/>
