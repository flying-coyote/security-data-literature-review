<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1738" width="1080" height="1738" role="img" aria-labelledby="fm-t fm-d">
<title id="fm-t">Two routes into the corpus, and the 40 database finds met an appraisal gate</title>
<desc id="fm-d">Flow diagram. The curation arm built most of the corpus by reading, starting from the footnotes of a 2024 practitioner manuscript and continuing with vendor and project documentation, standards, analyst reports and talks. The database arm searched OpenAlex and dblp on 2026-07-13: 400 records identified, 5 duplicates removed, 395 screened, 355 excluded and 40 included, none of which was already in the corpus. The 40 went to an appraisal gate, which refused 14 (8 predatory or compromised venues, 3 not peer-reviewed, 1 unreadable, 2 refuted by an independent verification pass) and admitted 26. Separately, a second screen of all 355 exclusions flagged 11, and 1 of them was later admitted through the same gate, so 27 database records were admitted in all. Both arms then pass through tiering A to D before entering MASTER-BIBLIOGRAPHY.md, whose live counts are derived by scripts/count_reconcile.py. A dashed box marks the standing rule that carried numbers are checked at the primary, with the verdict logged in RESEARCH-JOURNAL.md and the verification ledger and paywalled numbers marked unverifiable.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6878"/></marker></defs>
<rect width="1080" height="1738" fill="#ffffff"/>
<text x="48" y="70.0" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="42" font-weight="700" fill="#2c4f74" text-anchor="start">Two routes into the corpus, and the 40</text>
<text x="48" y="122.5" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="42" font-weight="700" fill="#2c4f74" text-anchor="start">database finds met an appraisal gate</text>
<text x="48" y="182" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="26" font-weight="400" fill="#5b6878" text-anchor="start">Method of this review; database search run 2026-07-13</text>
<text x="48" y="250" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="24" font-weight="700" fill="#5b6878" text-anchor="start">CURATION ARM</text>
<text x="452" y="250" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="24" font-weight="700" fill="#5b6878" text-anchor="start">DATABASE ARM</text>
<rect x="48" y="268" width="372" height="482" rx="12" fill="#eef3f9" stroke="#87aacf" stroke-width="2"/>
<text x="72" y="318.0" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="30" font-weight="700" fill="#243f5b" text-anchor="start">Built by reading,</text>
<text x="72" y="355.5" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="30" font-weight="700" fill="#243f5b" text-anchor="start">2025 to 2026</text>
<text x="72" y="410.0" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="28" font-weight="400" fill="#243f5b" text-anchor="start">Started from the</text>
<text x="72" y="445.0" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="28" font-weight="400" fill="#243f5b" text-anchor="start">footnotes of a 2024</text>
<text x="72" y="480.0" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="28" font-weight="400" fill="#243f5b" text-anchor="start">practitioner manuscript</text>
<text x="72" y="530.0" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="28" font-weight="400" fill="#243f5b" text-anchor="start">Then vendor and</text>
<text x="72" y="565.0" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="28" font-weight="400" fill="#243f5b" text-anchor="start">project docs,</text>
<text x="72" y="600.0" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="28" font-weight="400" fill="#243f5b" text-anchor="start">standards, analyst</text>
<text x="72" y="635.0" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="28" font-weight="400" fill="#243f5b" text-anchor="start">reports, talks</text>
<text x="72" y="690.0" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="24" font-weight="400" fill="#5b6878" text-anchor="start">Mostly grey literature</text>
<text x="72" y="720.0" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="24" font-weight="400" fill="#5b6878" text-anchor="start">a database cannot index</text>
