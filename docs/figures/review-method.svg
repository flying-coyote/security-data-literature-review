<text x="592" y="776.5" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="26" font-weight="400" fill="#5b6878" text-anchor="start">the 355 exclusions</text>
<text x="592" y="809.0" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="26" font-weight="400" fill="#5b6878" text-anchor="start">(11 flagged, 1 admitted)</text>
<line x1="802.0" y1="836" x2="802.0" y2="878" stroke="#5b6878" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/>
<rect x="452" y="880" width="580" height="308" rx="12" fill="#1f8fe0" stroke="#0f5f9e" stroke-width="3"/>
<text x="476" y="930" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="34" font-weight="700" fill="#ffffff" text-anchor="start">Appraisal gate</text>
<text x="476" y="972" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">14 of 40 refused:</text>
<rect x="468" y="996" width="548" height="176" rx="8" fill="#eef3f9" stroke="#eef3f9" stroke-width="2"/>
<text x="488" y="1034.0" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="28" font-weight="400" fill="#243f5b" text-anchor="start">8 predatory or compromised venue</text>
<text x="488" y="1070.4" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="28" font-weight="400" fill="#243f5b" text-anchor="start">3 not peer-reviewed, 1 unreadable</text>
<text x="488" y="1106.8" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="28" font-weight="400" fill="#243f5b" text-anchor="start">2 refuted by an independent</text>
<text x="488" y="1143.2" font-family='"DM Sans Variable","DM Sans",Arial,"Liberation Sans",sans-serif' font-size="28" font-weight="400" fill="#243f5b" text-anchor="start">verification pass</text>
<line x1="234.0" y1="750" x2="234.0" y2="1264" stroke="#5b6878" stroke-width="4" marker-end="url(#ah)"/>
